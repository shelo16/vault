name: release

# Push a tag like v0.1.3 to build vault for Windows, macOS and Linux
# and publish the files (plus install.sh / install.ps1) as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build all platforms
        run: |
          tag="${GITHUB_REF_NAME}"
          VERSION="${tag#v}" sh ./build.sh
          cp install.sh install.ps1 dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "vault $GITHUB_REF_NAME" --generate-notes
